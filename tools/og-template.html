<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Gabarit de l'image de partage</title>
<!-- Gabarit de img/og.png (1200 x 630). Polices, portrait et couleurs sont ceux
     du site. Après une modification, régénérer l'image avec og-render.cjs. -->
<style>
@font-face {
  font-family: "Atkinson Hyperlegible Next";
  font-weight: 400 700;
  src: url("../fonts/atkinson-latin.woff2") format("woff2");
}
@font-face {
  font-family: "DM Mono";
  font-weight: 400;
  src: url("../fonts/dmmono-latin.woff2") format("woff2");
}
:root {
  --paper: #EDEFE9;
  --ink: #1A231F;
  --ink-muted: #3E4741;
  --rule: #6C766F;
  --accent: #0D4853;
}
* { box-sizing: border-box; margin: 0; }
/* Positions épinglées plutôt que centrées : elles sont réglées pour un
   sous-titre de trois lignes. */
body {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  width: 1200px;
  height: 630px;
  padding: 0 90px 0 88px;
  background: var(--paper);
  color: var(--ink);
  font-family: "Atkinson Hyperlegible Next", sans-serif;
}
.ident { margin-top: 114px; }
h1 {
  font-size: 92px;
  font-weight: 700;
  letter-spacing: -0.025em;
  line-height: 96px;
}
/* La largeur donne les mêmes coupures de ligne que le sous-titre du site. */
.role {
  max-width: 470px;
  margin-top: 23px;
  font-size: 36px;
  line-height: 47px;
}
.rule {
  width: 96px;
  height: 2px;
  margin-top: 39px;
  background: var(--accent);
}
.place, .url {
  font-family: "DM Mono", monospace;
  font-size: 22px;
  line-height: 35px;
  letter-spacing: 0.03em;
}
.place { margin-top: 26px; color: var(--ink-muted); }
.url { color: var(--accent); }
img {
  margin-top: 163px;
  width: 300px;
  height: 300px;
  object-fit: cover;
  border: 1px solid var(--rule);
}
</style>
</head>
<body>
<div class="ident">
  <h1>Andréas Brey</h1>
  <p class="role">Ingénieur front-end senior, référent accessibilité et développement agentique</p>
  <div class="rule"></div>
  <p class="place">Strasbourg, France</p>
  <p class="url">andreas-brey.vercel.app</p>
</div>
<img src="../img/portrait.webp" alt="">
</body>
</html>
